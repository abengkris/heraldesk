name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src/heraldesk

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run the full suite
        if: runner.os != 'Windows'
        run: uv run pytest
      - name: Run core tests on Windows
        if: runner.os == 'Windows'
        run: uv run pytest -m core

  package:
    name: Build wheel and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Install the wheel and initialise an instance
        run: |
          uv venv /tmp/heraldesk-wheel --python 3.12
          uv pip install --python /tmp/heraldesk-wheel/bin/python --no-cache-dir dist/*.whl
          HERALDESK_HOME="$(mktemp -d)"
          export HERALDESK_HOME
          /tmp/heraldesk-wheel/bin/heraldesk init
          /tmp/heraldesk-wheel/bin/heraldesk doctor
          /tmp/heraldesk-wheel/bin/heraldesk --version

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Build
        run: docker build --tag heraldesk:ci .
      - name: Smoke test the entrypoint
        run: docker run --rm heraldesk:ci --version

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
      - name: Export runtime requirements
        run: uv export --format requirements-txt --no-dev --no-emit-project --no-hashes > requirements-audit.txt
      - name: Audit
        run: uvx pip-audit -r requirements-audit.txt
