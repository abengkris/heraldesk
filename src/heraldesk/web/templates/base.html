<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Heraldesk{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Heraldesk dashboard">Heraldesk</a>
    {% if not login %}
    <nav aria-label="Main navigation">
      <a href="/" {% if active == "dashboard" %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/queue" {% if active == "queue" %}aria-current="page"{% endif %}>Queue</a>
      <a href="/inbox" {% if active == "inbox" %}aria-current="page"{% endif %}>Inbox</a>
      <a href="/reports" {% if active == "reports" %}aria-current="page"{% endif %}>Reports</a>
      <a href="/cost" {% if active == "cost" %}aria-current="page"{% endif %}>Cost</a>
      <a href="/audit" {% if active == "audit" %}aria-current="page"{% endif %}>Audit</a>
      <a href="/profiles" {% if active == "profiles" %}aria-current="page"{% endif %}>Profiles</a>
    </nav>
    <div class="topbar-actions">
      <button type="button" id="theme-toggle" class="button ghost" aria-label="Toggle dark mode">Theme</button>
      <form method="post" action="/logout" class="inline-form">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="button ghost">Log out</button>
      </form>
    </div>
    {% endif %}
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <span>Heraldesk {{ version }}</span>
    <span>Local-first. No telemetry.</span>
  </footer>
</body>
</html>
