[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "heraldesk"
dynamic = ["version"]
description = "Your autonomous social media department. Self-hosted, open source, single-user."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Abeng" }]
keywords = ["social-media", "automation", "self-hosted", "llm", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "alembic>=1.14,<2",
  "apscheduler>=3.10,<4",
  # BIP-340 Schnorr signing for the Nostr adapter (libsecp256k1 via cffi).
  "coincurve>=21.0,<22",
  "cryptography>=43,<52",
  "fastapi>=0.115,<1",
  # Server-rendered Web UI (M11) and safe Markdown report rendering.
  "jinja2>=3.1,<4",
  "litellm>=1.55,<2",
  "markdown>=3.7,<4",
  "bleach>=6.2,<7",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2",
  "rich>=13.9,<16",
  "sqlalchemy>=2.0.36,<3",
  # Provides the IANA timezone database where the OS has none (Windows, minimal containers).
  "tzdata>=2024.1",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
  # Async RFC 6455 client used to broadcast Nostr events to relays.
  "websockets>=15,<18",
]

[project.scripts]
heraldesk = "heraldesk.cli.main:app"
hdesk = "heraldesk.cli.main:app"

[project.urls]
Homepage = "https://github.com/abengkris/heraldesk"
Documentation = "https://github.com/abengkris/heraldesk/blob/main/docs/architecture.md"
Repository = "https://github.com/abengkris/heraldesk"
Issues = "https://github.com/abengkris/heraldesk/issues"
Changelog = "https://github.com/abengkris/heraldesk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.8",
  "twine>=6.0",
  "types-bleach>=6.2",
  "types-Markdown>=3.7",
  "types-pyyaml>=6.0.12",
]

[tool.hatch.version]
path = "src/heraldesk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/heraldesk"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "heraldesk/_alembic"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "alembic", "alembic.ini", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "core: cross-platform core tests, also run on Windows",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "F401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/heraldesk"]
mypy_path = "src"
show_error_codes = true
